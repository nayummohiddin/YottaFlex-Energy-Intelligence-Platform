services:
  db:
    image: postgres:16
    container_name: yottaflex-postgres
    environment:
      POSTGRES_DB: yottaflex_energy
      POSTGRES_USER: yottaflex
      POSTGRES_PASSWORD: yottaflex_dev
    ports:
      - "5433:5432"
    volumes:
      - yottaflex_pg:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yottaflex -d yottaflex_energy"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  yottaflex_pg:
